name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Show Expo versions
        run: |
          echo "::notice title=expo-tags::$(npm view expo dist-tags --json | tr -d '\n')"

      - name: Install dependencies
        run: |
          set -o pipefail
          { npm install && (npm run setup || echo "setup post-step failed, continuing") && npx expo install --fix && npx expo install --check; } 2>&1 | tee /tmp/step.log
          echo "::notice title=deps::$(node -e "console.log(JSON.stringify(require('./package.json').dependencies))")"

      - name: Logic tests
        run: |
          set -o pipefail
          npx --yes tsx tests/logic.test.js 2>&1 | tee /tmp/step.log

      - name: Generate native Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee /tmp/step.log

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a 2>&1 | tee /tmp/step.log

      - name: Report error log
        if: failure()
        run: |
          if [ -f /tmp/step.log ]; then
            msg=$(tail -c 12000 /tmp/step.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build-log::$msg"
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/RemindMe.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: RemindMe-apk
          path: out/RemindMe.apk

      - name: Publish download page (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Remind Me — build ${{ github.run_number }}
          body: |
            להורדה בטלפון אנדרואיד: לחצו על RemindMe.apk למטה, פתחו את הקובץ ואשרו התקנה.
          files: out/RemindMe.apk
          make_latest: true
