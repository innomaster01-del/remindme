name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Show Expo versions
        run: |
          echo "::notice title=expo-tags::$(npm view expo dist-tags --json | tr -d '\n')"

      - name: Install dependencies
        run: |
          set -o pipefail
          { npm install && (npm run setup || echo "setup post-step failed, continuing") && npx expo install --fix && npx expo install --check; } 2>&1 | tee /tmp/step.log
          echo "::notice title=deps::$(node -e "console.log(JSON.stringify(require('./package.json').dependencies))")"

      - name: Logic tests
        run: |
          set -o pipefail
          npx --yes tsx tests/logic.test.js 2>&1 | tee /tmp/step.log

      - name: Generate native Android project
        run: |
          set -o pipefail
          npx expo prebuild --platform android --no-install 2>&1 | tee /tmp/step.log

      - name: Build APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 2>&1 | tee /tmp/step.log

      - name: Report error log
        if: failure()
        run: |
          if [ -f /tmp/step.log ]; then
            msg=$(tail -c 12000 /tmp/step.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build-log::$msg"
          fi

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/PoofReminder.apk
          ls -la out

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an Android emulator (install, launch, check it stays open)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: bash .github/smoke.sh

      - name: Report smoke test
        if: always()
        run: |
          status=$(cat /tmp/smoke/status.txt 2>/dev/null || echo NO_STATUS)
          grep -E "FATAL|AndroidRuntime: |E/ReactNativeJS|E/ReactNative" /tmp/smoke/logcat.txt 2>/dev/null | grep -v "START com.android.internal\|Using default boot\|lock profiling\|Calling main entry\|VM exiting" | head -60 > /tmp/smoke/errors.txt || true
          msg=$( (echo "STATUS: $status"; echo "--- errors ---"; cut -c1-300 /tmp/smoke/errors.txt; echo "--- screens ---"; cat /tmp/smoke/screens.txt 2>/dev/null) | head -c 14000 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::warning title=smoke-test::$msg"
          if ! grep -q APP_RUNNING /tmp/smoke/status.txt 2>/dev/null; then echo "::error::App is not running after launch"; exit 1; fi
          if grep -q 'reminder\] NOT POSTED' /tmp/smoke/screens.txt; then echo "::error::Reminder notification was not posted"; exit 1; fi
          if grep -q 'keyboard.*after 4s: mInputShown=false' /tmp/smoke/screens.txt; then echo "::error::Keyboard closed by itself"; exit 1; fi
          if grep -q 'not found' /tmp/smoke/screens.txt; then echo "::error::Smoke test could not reach every screen"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: |
            out/smoke.png
            /tmp/smoke/

      - uses: actions/upload-artifact@v4
        with:
          name: PoofReminder-apk
          path: out/PoofReminder.apk

      - name: Publish download page (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Poof Reminder — build ${{ github.run_number }}
          body: |
            להורדה בטלפון אנדרואיד: לחצו על PoofReminder.apk למטה, פתחו את הקובץ ואשרו התקנה.
          files: out/PoofReminder.apk
          make_latest: true
