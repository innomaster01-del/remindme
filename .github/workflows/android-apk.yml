name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show Expo versions
        run: npm view expo dist-tags

      - name: Install dependencies
        run: |
          npm install
          npm run setup
          npx expo install --fix

      - name: Logic tests
        run: npx --yes tsx tests/logic.test.js

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/RemindMe.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: RemindMe-apk
          path: out/RemindMe.apk

      - name: Publish download page (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Remind Me — build ${{ github.run_number }}
          body: |
            להורדה בטלפון אנדרואיד: לחצו על RemindMe.apk למטה, פתחו את הקובץ ואשרו התקנה.
          files: out/RemindMe.apk
          make_latest: true
